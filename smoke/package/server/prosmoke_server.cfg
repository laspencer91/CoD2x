// ProSmoke server policy. exec this file from your server config, or copy the
// line into it. "sets" publishes it to every client; the client cannot override it.
// Only the fields you want to change need to appear; v1 alone is the tuned default.
//
// Shape and timing
//   width        1.2   (0.5 - 1.5)  mature cloud radius multiplier
//   height       1.0   (0.5 - 2.0)  vertical size, on top of width
//   bloom_time   0     (0 - 30)     seconds to full size; 0 keeps bloom_rate
//   bloom_rate   512   (64 - 32768) new cells per second while growing
//   thicken      0.5   (0.05 - 3)   seconds for a reached cell to fill
//   duration     48    (10 - 90)    cloud lifetime in seconds
//   fade_time    12    (1 - 30)     final fade, must be below duration
//
// Carving (hole radius in game units; a player is about 30 units wide)
//   carve_scale    1.0   (0.5 - 2.0)  multiplies every radius below
//   carve_pistol   3     (1 - 20)     Colt, Luger, Webley, TT-30
//   carve_smg      3.5   (1 - 20)     Thompson, Grease Gun, MP40, PPSh, Sten
//   carve_rifle    4.5   (1 - 20)     MP44, BAR
//   carve_semi     4.75  (1 - 20)     Garand, M1 Carbine, G43, SVT-40
//   carve_sniper   11    (1 - 20)     Kar98k, Mosin, Enfield, Springfield, scoped
//   carve_shotgun  6     (1 - 20)     Trench Gun pellet cone at the muzzle
//
// Look: density, brightness, variation, shadow_strength, lightgrid_strength,
//   edge_softness, height_gradient, billow_size/strength/speed,
//   wisp_size/strength/speed, rise_speed, tint_r/g/b, tint_amount.
//
// Keep the line under about 400 characters; serverinfo is shared with hostname etc.
// A value outside its range or an unknown name disables smoke for everyone.

sets sv_prosmoke_policy "v1 width=1.35 variation=0.60 height_gradient=0.35 billow_strength=1.85 wisp_strength=1.7 billow_speed=1.1 wisp_speed=1.1 tint_amount=0.4 shadow_strength=0.65"
