[package]
name = "cod2-smoke-tool"
version = "0.1.0"
edition = "2021"
description = "Portable CoD2 smoke setup and occupancy tool"

[[bin]]
name = "CoD2SmokeTool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = "0.16"
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
